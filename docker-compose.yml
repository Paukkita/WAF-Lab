services:
  app:
    build: ./docker/php
    container_name: laravel_app
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    networks:
      - waf-lab

  web:
    image: nginx:alpine
    container_name: laravel_web
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - waf-lab

  proxy:
    image: owasp/modsecurity-crs:nginx
    container_name: laravel_proxy
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      BACKEND: http://web:80
      MODSEC_RULE_ENGINE: On  #DetectionOnly .De momento lo dejaremos solo en detectar para poder cerciorarnos del funcionamiento(cambiar en un futuro)
      PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
    depends_on:
      - web
    networks:
      - waf-lab

  db:
    image: mysql:8.0
    container_name: laravel_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: pau
      MYSQL_PASSWORD: paubaron
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - waf-lab

volumes:
  dbdata:

networks:
  waf-lab: